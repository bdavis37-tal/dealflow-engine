name: Engine and benchmark validation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e '.[dev]'
      - run: pytest -q
      - run: python scripts/validate_benchmarks.py
      - run: python scripts/evaluate_engines.py --output ../reports/current-ci.json --baseline ../reports/baseline.json
      - run: python scripts/evaluate_empirical.py --input app/data/benchmarks/empirical_observations.json --output ../reports/empirical-ci.json --split-date 2026-07-01
      - uses: actions/upload-artifact@v4
        with:
          name: engine-evaluation
          path: reports/*-ci.json
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test -- --run
      - run: npm run build
